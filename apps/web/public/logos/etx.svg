<?xml version="1.0" encoding="UTF-8"?>
<!--
  EticaHub Token (ETX) — PLACEHOLDER logo.

  Shipped as a stop-gap so aggregator submission forms that require a
  200x200 logo (CoinGecko, CoinMarketCap) aren't blocked. Replace with
  final art before or after the submissions go live — the SVG path below
  was generated in-repo, it is NOT the project's final brand mark.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="EticaHub Token (ETX)">
  <defs>
    <linearGradient id="etx-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2E1065"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="etx-fg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#DDD6FE"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#etx-bg)"/>
  <!-- Ring suggesting the hub-and-spoke pair graph ETX sits at the center of. -->
  <circle cx="100" cy="100" r="78" fill="none" stroke="url(#etx-fg)" stroke-width="3" stroke-opacity="0.35"/>
  <!-- Four spoke dots. -->
  <g fill="url(#etx-fg)" fill-opacity="0.8">
    <circle cx="100" cy="22" r="4"/>
    <circle cx="178" cy="100" r="4"/>
    <circle cx="100" cy="178" r="4"/>
    <circle cx="22" cy="100" r="4"/>
  </g>
  <!-- Wordmark. Font-family stays generic so the SVG renders consistently on
       aggregator dashboards that may not load web fonts. -->
  <text x="100" y="118" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial, sans-serif"
        font-weight="700" font-size="54" letter-spacing="2"
        fill="url(#etx-fg)">ETX</text>
</svg>
