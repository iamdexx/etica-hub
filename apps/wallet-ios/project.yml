name: EticaHubWallet
options:
  bundleIdPrefix: com.eticahub
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
packages:
  web3swift:
    url: https://github.com/web3swift-team/web3swift
    from: "3.3.2"
targets:
  EticaHubWallet:
    type: application
    platform: iOS
    sources:
      - path: EticaHubWallet/Sources
      - path: EticaHubWallet/Resources
    dependencies:
      - package: web3swift
        product: web3swift
    info:
      path: EticaHubWallet/Info.plist
      properties:
        CFBundleDisplayName: EticaHub Wallet
        CFBundleName: EticaHub Wallet
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: Unlock your wallet and approve transactions.
        NSCameraUsageDescription: Scan a wallet address QR code to send to it.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eticahub.wallet
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  EticaHubWalletTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: EticaHubWallet
