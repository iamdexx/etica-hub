[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [
  { access = "read-write", path = "./broadcast" },
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "./out" },
]

remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
  "permit2/=lib/permit2/",
]

[rpc_endpoints]
etica_mainnet = "${ETICA_MAINNET_RPC_URL}"
etica_crucible = "${ETICA_CRUCIBLE_RPC_URL}"

# No [etherscan] block.
#
# eticascan.org does NOT currently expose an Etherscan- or Blockscout-style
# contract-verification API. The `/verifyContract` page is an unimplemented
# Vue placeholder and the `/api` path serves only API documentation HTML; the
# real `/api/*` surface is Etica-protocol-specific (proposals / disease /
# slashs / stakes / etc.) with no generic EVM verify route. Sourcify likewise
# does not support chainId 61803 at time of writing.
#
# Contracts are verified against forge artifacts + on-chain bytecode by
# `apps/web/scripts/verify-contract.mjs`, which writes manifests to
# `apps/web/public/verified/<address>.json`. The explorer at
# eticahub.com/explorer consumes those manifests directly.
#
# If/when either eticascan.org ships a verification API or Sourcify adds
# chain 61803, re-add an `[etherscan]` entry here and a `forge verify-contract`
# step to the release runbook.

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
