[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
evm_version = "paris"
optimizer = true
optimizer_runs = 1_000_000
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [
  { access = "read-write", path = "./broadcast" },
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "./out" },
]

remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
  "permit2/=lib/permit2/",
]

[rpc_endpoints]
etica_mainnet = "${ETICA_MAINNET_RPC_URL}"
etica_crucible = "${ETICA_CRUCIBLE_RPC_URL}"

[etherscan]
# Etica explorer uses a Blockscout-compatible API.
etica_mainnet = { key = "${ETICASCAN_API_KEY}", url = "https://www.eticascan.org/api" }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
