name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build
        run: forge build --sizes
        working-directory: packages/contracts

      - name: Test
        run: forge test -vv
        working-directory: packages/contracts

      - name: Format check
        run: forge fmt --check
        working-directory: packages/contracts

  trading-contracts:
    name: Trading Contracts (Foundry + UniswapX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build
        run: forge build --sizes
        working-directory: packages/trading-contracts

      - name: Test
        run: forge test -vv
        working-directory: packages/trading-contracts

      - name: Format check
        run: forge fmt --check src script test
        working-directory: packages/trading-contracts

  js:
    name: Web + Indexer (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build web
        run: pnpm --filter @etica-hub/web build

      - name: Test web
        run: pnpm --filter @etica-hub/web test

      - name: Build indexer
        run: pnpm --filter @etica-hub/indexer build

      - name: Test indexer
        run: pnpm --filter @etica-hub/indexer test

      - name: Build orderbook
        run: pnpm --filter @etica-hub/orderbook build

      - name: Test orderbook
        run: pnpm --filter @etica-hub/orderbook test

      - name: Build keeper
        run: pnpm --filter @etica-hub/keeper build

      - name: Test keeper
        run: pnpm --filter @etica-hub/keeper test
