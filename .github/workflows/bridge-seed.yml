name: Bridge seed (USDC.e/ETX pool)

# One-shot bootstrap of the USDC.e/ETX pool, signed by the keeper EOA
# (`harvest-live`). In order:
#   1. Ethereum: approve + transferRemote() the keeper's USDC to its own
#      Etica address through the live warp route (Flashbots Protect),
#   2. wait for the relayer to mint USDC.e (a re-dispatch after a timeout finds
#      the transfer still in flight and waits instead of bridging again),
#   3. Etica: router.addLiquidity(USDC.e, ETX) with the LP minted straight to
#      0x…dEaD — opening the pair pays the factory's 10,000 ETX fee on top.
# Idempotent: once the pair holds reserves with its LP at the dead address the
# run reports and exits 0; a pair someone else opened is refused.
# Every contract address is pinned in code; only amounts, the USD price
# anchors and RPC endpoints come from inputs.

on:
  workflow_dispatch:
    inputs:
      etx_amount:
        description: 'ETX side of the pool (the 10,000 ETX pair fee is extra)'
        required: true
        default: '5000'
      usdc_amount:
        description: 'USDC to bridge and pool; blank = everything the wallet can afford after the bridge fee'
        default: ''
      egaz_usd:
        description: 'EGAZ price in USD (CoinGecko "etica"): the pool price must sit within 3% of the ETX/WEGAZ pool quote x this'
        default: ''
      etx_usd:
        description: 'ETX price in USD from an off-chain source (CoinGecko "etx"), checked directly against the pool price. A live run needs egaz_usd and/or etx_usd; set both so a shifted on-chain quote cannot pass alone'
        default: ''
      dry_run:
        description: 'Snapshot and plan without submitting'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  seed:
    name: Bridge USDC, open USDC.e/ETX, burn the LP
    runs-on: ubuntu-latest
    environment: harvest-live
    timeout-minutes: 90
    env:
      BRIDGE_SEED_DRY_RUN: ${{ inputs.dry_run || 'false' }}
      HARVEST_PRIVATE_KEY: ${{ secrets.HARVEST_KEEPER_PRIVATE_KEY }}
      BRIDGE_SEED_ETX_AMOUNT: ${{ inputs.etx_amount }}
      BRIDGE_SEED_USDC_AMOUNT: ${{ inputs.usdc_amount }}
      BRIDGE_SEED_EGAZ_USD: ${{ inputs.egaz_usd }}
      BRIDGE_SEED_ETX_USD: ${{ inputs.etx_usd }}
      # Same endpoints as the hourly bridge-gas keeper.
      BRIDGE_SEED_ETHEREUM_RPC_URL: ${{ secrets.BRIDGE_ETHEREUM_RPC_URL }}
      BRIDGE_SEED_ETICA_RPC_URL: ${{ vars.HARVEST_RPC_URL || 'https://rpc2.etica-stats.org' }}
    steps:
      - name: Guard against missing gas-payer key
        if: ${{ env.HARVEST_PRIVATE_KEY == '' && env.BRIDGE_SEED_DRY_RUN != 'true' }}
        run: |
          echo "::error::HARVEST_KEEPER_PRIVATE_KEY is not set in the harvest-live environment"
          exit 1

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Dry run
        if: ${{ env.BRIDGE_SEED_DRY_RUN == 'true' }}
        run: pnpm --filter @etica-hub/keeper run bridge-seed:dry-run

      - name: Live run
        if: ${{ env.BRIDGE_SEED_DRY_RUN != 'true' }}
        run: pnpm --filter @etica-hub/keeper run bridge-seed:live
