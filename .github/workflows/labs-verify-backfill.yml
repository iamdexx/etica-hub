# Regrade archived Labs research with the objective verifier.
#
# Manual only: the verifier changes rarely, and a full pass rewrites every
# archive record. Walks the archive page by page via the worker-token
# endpoint, which returns the next offset until the archive is exhausted.
#
# Secrets used:
#   LABS_AUTOPILOT_TOKEN — shared worker secret (same value as on Vercel)
name: Labs Verify Backfill

on:
  workflow_dispatch:
    inputs:
      offset:
        description: 'Archive offset to resume from'
        required: false
        default: '0'
      limit:
        description: 'Records per request (max 50)'
        required: false
        default: '25'
      max_pages:
        description: 'Safety cap on pages per run'
        required: false
        default: '80'
      reground:
        description: 'Recompute grounding that is already stored'
        type: boolean
        required: false
        default: false
      base_url:
        description: 'Override deployment to regrade (eticahub.com or a *.vercel.app preview only)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: labs-verify-backfill
  cancel-in-progress: false

jobs:
  backfill:
    name: Regrade archive
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      BASE_URL: ${{ github.event.inputs.base_url || vars.LABS_AUTOPILOT_BASE_URL || 'https://eticahub.com' }}
      TOKEN: ${{ secrets.LABS_AUTOPILOT_TOKEN }}
      OFFSET: ${{ github.event.inputs.offset || '0' }}
      LIMIT: ${{ github.event.inputs.limit || '25' }}
      MAX_PAGES: ${{ github.event.inputs.max_pages || '80' }}
      REGROUND: ${{ github.event.inputs.reground == 'true' && 'true' || 'false' }}
    steps:
      - name: Guard — worker token present, target is ours
        run: |
          # The worker token is attached to every request, so the override
          # must not be able to point it at a host we don't control. Match on
          # the bare host only: a path, query or userinfo can otherwise end in
          # an allowed suffix while the request goes somewhere else.
          case "$BASE_URL" in
            https://*) host="${BASE_URL#https://}" ;;
            *) host='!' ;;
          esac
          case "$host" in
            *[!a-zA-Z0-9.-]*) host='!' ;;
          esac
          case "$host" in
            eticahub.com|*.eticahub.com|*.vercel.app) ;;
            *)
              echo "::error::refusing to send the worker token to $BASE_URL"
              exit 1
              ;;
          esac
          if [ -z "$TOKEN" ]; then
            echo "::error::LABS_AUTOPILOT_TOKEN secret not set"
            exit 1
          fi

      - name: Walk the archive
        run: |
          set -euo pipefail
          offset="$OFFSET"
          total_verified=0; total_weak=0; total_rejected=0; total_reranked=0; processed=0
          total_grounded=0; total_ungrounded=0
          for page in $(seq 1 "$MAX_PAGES"); do
            body=$(printf '{"offset":%s,"limit":%s,"reground":%s}' "$offset" "$LIMIT" "$REGROUND")
            resp=$(curl -sS --max-time 300 -X POST "$BASE_URL/api/labs/archive/verify-backfill" \
              -H "x-labs-worker-token: $TOKEN" \
              -H 'content-type: application/json' \
              -d "$body" || echo '{}')
            # A gateway timeout answers with HTML, which jq cannot parse. One
            # page is worth a retry, not the whole walk.
            ok=$(printf '%s' "$resp" | jq -r '.ok // false' 2>/dev/null || echo false)
            if [ "$ok" != "true" ]; then
              echo "::warning::page at offset $offset failed, retrying once: $(printf '%s' "$resp" | head -c 200)"
              sleep 20
              resp=$(curl -sS --max-time 300 -X POST "$BASE_URL/api/labs/archive/verify-backfill" \
                -H "x-labs-worker-token: $TOKEN" \
                -H 'content-type: application/json' \
                -d "$body" || echo '{}')
              ok=$(printf '%s' "$resp" | jq -r '.ok // false' 2>/dev/null || echo false)
            fi
            if [ "$ok" != "true" ]; then
              echo "::error::backfill failed at offset $offset: $(printf '%s' "$resp" | head -c 500)"
              exit 1
            fi
            processed=$((processed + $(printf '%s' "$resp" | jq -r '.processed')))
            total_verified=$((total_verified + $(printf '%s' "$resp" | jq -r '.counts.verified')))
            total_weak=$((total_weak + $(printf '%s' "$resp" | jq -r '.counts.weak')))
            total_rejected=$((total_rejected + $(printf '%s' "$resp" | jq -r '.counts.rejected')))
            total_reranked=$((total_reranked + $(printf '%s' "$resp" | jq -r '.rerankedBest')))
            total_grounded=$((total_grounded + $(printf '%s' "$resp" | jq -r '.grounding.grounded')))
            total_ungrounded=$((total_ungrounded + $(printf '%s' "$resp" | jq -r '.grounding.ungrounded')))
            next=$(printf '%s' "$resp" | jq -r '.nextOffset')
            echo "page $page: $(printf '%s' "$resp" | jq -c '{processed,counts,rerankedBest,grounding,nextOffset}')"
            if [ "$next" = "null" ]; then break; fi
            offset="$next"
          done
          {
            echo "### Labs verification backfill"
            echo ""
            echo "| metric | value |"
            echo "| --- | --- |"
            echo "| records regraded | $processed |"
            echo "| verified | $total_verified |"
            echo "| weak | $total_weak |"
            echo "| rejected | $total_rejected |"
            echo "| headline candidate re-ranked | $total_reranked |"
            echo "| targets grounded | $total_grounded |"
            echo "| no target resolved | $total_ungrounded |"
            echo "| resume offset | $offset |"
          } >> "$GITHUB_STEP_SUMMARY"
