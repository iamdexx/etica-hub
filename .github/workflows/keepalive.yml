name: Keepalive scheduled workflows

# GitHub disables every `schedule:` workflow in a public repo after 60 days
# without a commit to the default branch ("disabled_inactivity"). When that
# happens the bridge heartbeat, keeper, indexer and harvest all silently
# stop. This job runs weekly and (a) re-enables any workflow that was
# auto-disabled and (b) pushes an empty commit when the default branch has
# been idle for 45+ days so the inactivity clock never reaches 60.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Re-enable auto-disabled workflows
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows" \
            --jq '.workflows[] | select(.state == "disabled_inactivity") | .id' |
          while read -r id; do
            echo "re-enabling workflow $id"
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${id}/enable"
          done

      - name: Empty commit if default branch idle for 45+ days
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_days=$(( (now - last) / 86400 ))
          echo "default branch last commit ${age_days}d ago"
          if [ "$age_days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive scheduled workflows"
            git push
          fi
