name: Harvest (live)

# Manually-triggered live execution of the treasury harvest pipeline.
#
# SAFETY MODEL
# ────────────
# The treasury key is NEVER used here. Instead this workflow drives the
# TreasuryHarvester delegation contract via a hot keeper EOA:
#
#   1. Treasury (multisig) pre-approves LP tokens on both ETX pools + ETX
#      to the harvester contract — one-time governance tx.
#   2. Treasury calls `harvester.setStakedEtx(...)` / `setFarms(...)` /
#      `setSplit(...)` to mirror the keeper-side defaults (10/10/40/40).
#   3. The hot keeper EOA is funded with ~100 EGAZ quarterly for gas.
#   4. This workflow runs `pnpm --filter @etica-hub/keeper run harvest:live`
#      with the KEEPER_PRIVATE_KEY secret, submitting a single
#      `harvester.harvest(pools)` call.
#
# If the hot keeper key is ever compromised, the blast radius is bounded
# by `maxBurnBpsPerRun` of treasury LP per invocation (default 1%) and
# the slippage guards baked into each PoolPlan.
#
# PRECONDITIONS before triggering a live run
# ───────────────────────────────────────────
#   ✓ TreasuryHarvester deployed + address in `vars.HARVEST_HARVESTER_ADDRESS`
#   ✓ treasury approvals + slice config mirrored on-chain
#   ✓ hot keeper EOA funded with EGAZ for gas (see docs/harvester/EGAZ-GAS-RUNBOOK.md)
#   ✓ most recent scheduled dry-run was healthy (no errors, plan size sane)
#
# Use `workflow_dispatch` manually — never enable a cron on this file.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "HARVEST" to confirm live execution'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  harvest-live:
    name: Harvest live tick
    runs-on: ubuntu-latest
    environment: harvest-live
    if: ${{ github.event.inputs.confirm == 'HARVEST' }}
    env:
      HARVEST_RPC_URL: ${{ vars.HARVEST_RPC_URL || 'https://eticamainnet.eticascan.org' }}
      HARVEST_CHAIN_ID: ${{ vars.HARVEST_CHAIN_ID || '61803' }}
      HARVEST_FACTORY_ADDRESS: ${{ vars.HARVEST_FACTORY_ADDRESS || '0xfc8dE5A5087c8825AA54E2C57B3FFe0e23784bc3' }}
      HARVEST_ROUTER_ADDRESS: ${{ vars.HARVEST_ROUTER_ADDRESS || '0xaefbf3fB975657a4C71ea0Fb644B4afE5F555723' }}
      HARVEST_ETX_ADDRESS: ${{ vars.HARVEST_ETX_ADDRESS || '0xa5A1Bc6307b0b87989B8456D4b35F88a68650044' }}
      HARVEST_ETI_ADDRESS: ${{ vars.HARVEST_ETI_ADDRESS || '0x34c61EA91bAcdA647269d4e310A86b875c09946f' }}
      HARVEST_WEGAZ_ADDRESS: ${{ vars.HARVEST_WEGAZ_ADDRESS || '0x232fb2B87CAce92B2438054A7eB79B4081E3E11a' }}
      HARVEST_TREASURY_ADDRESS: ${{ vars.HARVEST_TREASURY_ADDRESS || '0xB2B4bC9d02970A55efF64C2D84c622c87967C19D' }}
      HARVEST_STAKED_ETX_ADDRESS: ${{ vars.HARVEST_STAKED_ETX_ADDRESS || '' }}
      HARVEST_FARMS_ADDRESS: ${{ vars.HARVEST_FARMS_ADDRESS || '' }}
      # REQUIRED for live: the deployed TreasuryHarvester contract.
      HARVEST_HARVESTER_ADDRESS: ${{ vars.HARVEST_HARVESTER_ADDRESS }}
      HARVEST_STAKED_ETX_BPS: ${{ vars.HARVEST_STAKED_ETX_BPS || '1000' }}
      HARVEST_FARMS_BPS: ${{ vars.HARVEST_FARMS_BPS || '1000' }}
      HARVEST_POL_BURN_BPS: ${{ vars.HARVEST_POL_BURN_BPS || '4000' }}
      HARVEST_TREASURY_BPS: ${{ vars.HARVEST_TREASURY_BPS || '4000' }}
      HARVEST_BURN_BPS_PER_RUN: ${{ vars.HARVEST_BURN_BPS_PER_RUN || '100' }}
      HARVEST_MAX_SLIPPAGE_BPS: ${{ vars.HARVEST_MAX_SLIPPAGE_BPS || '300' }}
      HARVEST_POL_WEIGHTING: ${{ vars.HARVEST_POL_WEIGHTING || 'treasury_lp' }}
      HARVEST_DRY_RUN: 'false'
      # Hot keeper EOA key — NEVER the treasury key. Must match
      # `harvester.keeper()` on-chain; run.ts asserts this before sending.
      HARVEST_PRIVATE_KEY: ${{ secrets.HARVEST_KEEPER_PRIVATE_KEY }}
    steps:
      - name: Guard against missing harvester address
        if: ${{ env.HARVEST_HARVESTER_ADDRESS == '' }}
        run: |
          echo "::error ::HARVEST_HARVESTER_ADDRESS repository variable is unset."
          echo "Deploy the TreasuryHarvester contract first and set the var."
          exit 1

      - name: Guard against missing keeper key
        if: ${{ env.HARVEST_PRIVATE_KEY == '' }}
        run: |
          echo "::error ::HARVEST_KEEPER_PRIVATE_KEY secret is unset."
          echo "Provision a hot keeper EOA and wire its key as an environment secret on the 'harvest-live' environment."
          exit 1

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Harvest live
        run: pnpm --filter @etica-hub/keeper run harvest:live
