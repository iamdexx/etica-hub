name: Bridge execute (live)

# Calls executeClaim(nonce) on matured PENDING claims so end users do
# not pay destination-chain gas. Re-runs the same Etica-side sanity
# check the monitor performs and refuses to execute (alerting via
# Telegram) on any mismatch.
#
# `executeClaim` is permissionless on-chain. The execute EOA has no
# privileged role; if it leaks, fund a new EOA and rotate the secret.
#
# Skip-clean: if BRIDGE_EXECUTE_PRIVATE_KEY is unset, the script logs
# and exits 0.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute:
    name: Auto-execute matured claims
    runs-on: ubuntu-latest
    environment: bridge-watcher
    env:
      BRIDGE_ETICA_RPC_URL: ${{ vars.BRIDGE_ETICA_RPC_URL || 'https://eticamainnet.eticaprotocol.org' }}
      BRIDGE_ETICA_CHAIN_ID: ${{ vars.BRIDGE_ETICA_CHAIN_ID || '61803' }}
      BRIDGE_VAULT_ADDRESS: ${{ vars.BRIDGE_VAULT_ADDRESS }}
      BRIDGE_MINTER_ETH_ADDRESS: ${{ vars.BRIDGE_MINTER_ETH_ADDRESS }}
      BRIDGE_ETH_RPC_URL: ${{ vars.BRIDGE_ETH_RPC_URL || 'https://ethereum-rpc.publicnode.com' }}
      BRIDGE_ETH_DOMAIN: ${{ vars.BRIDGE_ETH_DOMAIN || '1' }}
      BRIDGE_MINTER_BNB_ADDRESS: ${{ vars.BRIDGE_MINTER_BNB_ADDRESS }}
      BRIDGE_BNB_RPC_URL: ${{ vars.BRIDGE_BNB_RPC_URL || 'https://bsc-rpc.publicnode.com' }}
      BRIDGE_BNB_DOMAIN: ${{ vars.BRIDGE_BNB_DOMAIN || '56' }}
      BRIDGE_SCAN_LOOKBACK_BLOCKS: ${{ vars.BRIDGE_SCAN_LOOKBACK_BLOCKS || '5000' }}
      BRIDGE_EXECUTE_PRIVATE_KEY: ${{ secrets.BRIDGE_EXECUTE_PRIVATE_KEY }}
      BRIDGE_TELEGRAM_BOT_TOKEN: ${{ secrets.BRIDGE_TELEGRAM_BOT_TOKEN }}
      BRIDGE_TELEGRAM_CHAT_ID: ${{ secrets.BRIDGE_TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Auto-execute matured claims
        run: pnpm --filter @etica-hub/bridge-watcher run execute
