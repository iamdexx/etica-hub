name: Harvest (dry-run)

# Daily harvester that plans how treasury protocol-fee LP would be burned,
# swapped to ETX, and split 10/10/40/40 across stETX holders, LP farms,
# protocol-owned liquidity (POL burned to 0xdead), and the treasury.
#
# This workflow runs log-only: `apps/keeper/src/harvest/dry-run.ts` force-
# enables dryRun regardless of whether a signer key is present. Any live
# execution must be gated behind a separate, manually-triggered workflow
# with explicit keeper key secrets — not this one.
#
# Defaults: 10% stETX / 10% farms / 40% POL / 40% treasury, burn-per-run
# of 100 bps (1% of treasury LP), slippage cap 300 bps (3%), POL slice
# split across ETI/ETX and WEGAZ/ETX pools by treasury-LP weight.
#
# All knobs are env-var driven — change the split, burn cadence, or
# weighting by editing repo variables, no code change needed.

on:
  schedule:
    # Once per day at 00:15 UTC. Treasury LP accrues slowly today; a daily
    # cadence surfaces drift without spamming logs.
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harvest-dry-run:
    name: Harvest dry-run tick
    runs-on: ubuntu-latest
    env:
      HARVEST_RPC_URL: ${{ vars.HARVEST_RPC_URL || 'https://eticamainnet.eticascan.org' }}
      HARVEST_CHAIN_ID: ${{ vars.HARVEST_CHAIN_ID || '61803' }}
      HARVEST_FACTORY_ADDRESS: ${{ vars.HARVEST_FACTORY_ADDRESS || '0xfc8dE5A5087c8825AA54E2C57B3FFe0e23784bc3' }}
      HARVEST_ROUTER_ADDRESS: ${{ vars.HARVEST_ROUTER_ADDRESS || '0xaefbf3fB975657a4C71ea0Fb644B4afE5F555723' }}
      HARVEST_ETX_ADDRESS: ${{ vars.HARVEST_ETX_ADDRESS || '0xa5A1Bc6307b0b87989B8456D4b35F88a68650044' }}
      HARVEST_ETI_ADDRESS: ${{ vars.HARVEST_ETI_ADDRESS || '0x34c61EA91bAcdA647269d4e310A86b875c09946f' }}
      HARVEST_WEGAZ_ADDRESS: ${{ vars.HARVEST_WEGAZ_ADDRESS || '0x232fb2B87CAce92B2438054A7eB79B4081E3E11a' }}
      HARVEST_TREASURY_ADDRESS: ${{ vars.HARVEST_TREASURY_ADDRESS || '0xB2B4bC9d02970A55efF64C2D84c622c87967C19D' }}
      # Optional — empty / zero address routes those slices to treasury retain.
      HARVEST_STAKED_ETX_ADDRESS: ${{ vars.HARVEST_STAKED_ETX_ADDRESS || '' }}
      HARVEST_FARMS_ADDRESS: ${{ vars.HARVEST_FARMS_ADDRESS || '' }}
      # Split knobs (bps, must sum to 10000). Defaults: 10/10/40/40.
      HARVEST_STAKED_ETX_BPS: ${{ vars.HARVEST_STAKED_ETX_BPS || '1000' }}
      HARVEST_FARMS_BPS: ${{ vars.HARVEST_FARMS_BPS || '1000' }}
      HARVEST_POL_BURN_BPS: ${{ vars.HARVEST_POL_BURN_BPS || '4000' }}
      HARVEST_TREASURY_BPS: ${{ vars.HARVEST_TREASURY_BPS || '4000' }}
      HARVEST_BURN_BPS_PER_RUN: ${{ vars.HARVEST_BURN_BPS_PER_RUN || '100' }}
      HARVEST_MAX_SLIPPAGE_BPS: ${{ vars.HARVEST_MAX_SLIPPAGE_BPS || '300' }}
      HARVEST_POL_WEIGHTING: ${{ vars.HARVEST_POL_WEIGHTING || 'treasury_lp' }}
      # Force-disabled here; a live-execution workflow lives separately.
      HARVEST_DRY_RUN: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Harvest dry-run
        run: pnpm --filter @etica-hub/keeper run harvest:dry-run
