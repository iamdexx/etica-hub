name: Harvest (live)

# Daily permissionless treasury harvest.
#
# Calls `TreasuryHarvester.harvest(pools)` on the deployed v2 harvester
# (0x5d8B…76f5) from a hot "crank" EOA that has no privileged role on-chain.
# `harvest()` is permissionless (anyone can call it) — the crank EOA exists
# solely to pay gas on a predictable cadence. Blast radius per call is
# capped by on-chain `maxBurnBpsPerRun` (1% of treasury LP) and
# `harvestCooldown` (23h). Any community member could equivalently run
# this script from their own box if the default cron is down.
#
# Split: 10% stETX / 10% farms / 40% POL-burn / 40% treasury.
# POL slice is split across ETI/ETX and WEGAZ/ETX pools by treasury-LP
# weight (`HARVEST_POL_WEIGHTING=treasury_lp`).
#
# All knobs are env-var driven — change the split, burn cadence, or
# weighting by editing repo variables, no code change needed.

on:
  schedule:
    # Once per day at 00:15 UTC. On-chain cooldown is 23h so daily is the
    # tightest cadence that is never rejected.
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harvest-live:
    name: Harvest live tick
    runs-on: ubuntu-latest
    environment: harvest-live
    env:
      HARVEST_RPC_URL: ${{ vars.HARVEST_RPC_URL || 'https://rpc2.etica-stats.org' }}
      HARVEST_CHAIN_ID: ${{ vars.HARVEST_CHAIN_ID || '61803' }}
      HARVEST_FACTORY_ADDRESS: ${{ vars.HARVEST_FACTORY_ADDRESS || '0xfc8dE5A5087c8825AA54E2C57B3FFe0e23784bc3' }}
      HARVEST_ROUTER_ADDRESS: ${{ vars.HARVEST_ROUTER_ADDRESS || '0xaefbf3fB975657a4C71ea0Fb644B4afE5F555723' }}
      HARVEST_ETX_ADDRESS: ${{ vars.HARVEST_ETX_ADDRESS || '0xa5A1Bc6307b0b87989B8456D4b35F88a68650044' }}
      HARVEST_ETI_ADDRESS: ${{ vars.HARVEST_ETI_ADDRESS || '0x34c61EA91bAcdA647269d4e310A86b875c09946f' }}
      HARVEST_WEGAZ_ADDRESS: ${{ vars.HARVEST_WEGAZ_ADDRESS || '0x232fb2B87CAce92B2438054A7eB79B4081E3E11a' }}
      HARVEST_TREASURY_ADDRESS: ${{ vars.HARVEST_TREASURY_ADDRESS || '0xB2B4bC9d02970A55efF64C2D84c622c87967C19D' }}
      HARVEST_STAKED_ETX_ADDRESS: ${{ vars.HARVEST_STAKED_ETX_ADDRESS || '0x75d81d03a98CD9195593b8963aF17E13fAa70334' }}
      HARVEST_FARMS_ADDRESS: ${{ vars.HARVEST_FARMS_ADDRESS || '0xEBAfdd24ABF8290f0B433E689631466ABD13c6aD' }}
      HARVEST_HARVESTER_ADDRESS: ${{ vars.HARVEST_HARVESTER_ADDRESS || '0x5d8B1138559fADc3Bb90e8317eB16922eAa076f5' }}
      HARVEST_STAKED_ETX_BPS: ${{ vars.HARVEST_STAKED_ETX_BPS || '1000' }}
      HARVEST_FARMS_BPS: ${{ vars.HARVEST_FARMS_BPS || '1000' }}
      HARVEST_POL_BURN_BPS: ${{ vars.HARVEST_POL_BURN_BPS || '4000' }}
      HARVEST_TREASURY_BPS: ${{ vars.HARVEST_TREASURY_BPS || '4000' }}
      HARVEST_BURN_BPS_PER_RUN: ${{ vars.HARVEST_BURN_BPS_PER_RUN || '100' }}
      HARVEST_MAX_SLIPPAGE_BPS: ${{ vars.HARVEST_MAX_SLIPPAGE_BPS || '300' }}
      HARVEST_POL_WEIGHTING: ${{ vars.HARVEST_POL_WEIGHTING || 'treasury_lp' }}
      HARVEST_DRY_RUN: 'false'
      # Gas-paying EOA key — NO privileged role on-chain. The harvester is
      # permissionless; this key only pays gas. If it ever leaks, rotate
      # the repo secret — there is nothing to revoke on-chain.
      HARVEST_PRIVATE_KEY: ${{ secrets.HARVEST_KEEPER_PRIVATE_KEY }}
    steps:
      - name: Guard against missing harvester address
        if: ${{ env.HARVEST_HARVESTER_ADDRESS == '' }}
        run: |
          echo "::error ::HARVEST_HARVESTER_ADDRESS is unset."
          echo "Set it as a repo variable to the deployed TreasuryHarvester contract."
          exit 1

      - name: Guard against missing gas-payer key
        if: ${{ env.HARVEST_PRIVATE_KEY == '' }}
        run: |
          echo "::error ::HARVEST_KEEPER_PRIVATE_KEY secret is unset on the 'harvest-live' environment."
          echo "Provision a funded EOA and wire its private key as a secret."
          exit 1

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Harvest live
        run: pnpm --filter @etica-hub/keeper run harvest:live
