name: Miner release

on:
  push:
    tags: ["miner-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, args: "" }
          - { name: macos-arm, os: macos-latest, args: "--target aarch64-apple-darwin" }
          - { name: macos-intel, os: macos-15-intel, args: "--target x86_64-apple-darwin" }
          - { name: linux, os: ubuntu-22.04, args: "" }
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.args, 'aarch64') && 'aarch64-apple-darwin' || contains(matrix.args, 'x86_64') && 'x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/miner/src-tauri

      - name: Linux webkit deps
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install
        run: pnpm install --frozen-lockfile --filter @etica-hub/miner

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/miner
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'miner-latest' }}
          releaseName: EticaHub Miner ${{ github.ref_type == 'tag' && github.ref_name || 'dev build' }}
          releaseBody: |
            One-click ETI (CPU) + EGAZ (GPU) miner for the EticaHub pools.
            Windows: .msi or -setup.exe. macOS: .dmg (Apple Silicon or Intel). Linux: .AppImage or .deb.
            Unsigned build: Windows SmartScreen and macOS Gatekeeper will ask you to confirm the first run.
          releaseDraft: false
          prerelease: ${{ github.ref_type != 'tag' }}
          args: ${{ matrix.args }}
