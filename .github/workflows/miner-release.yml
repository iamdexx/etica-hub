name: Miner release

on:
  push:
    tags: ["miner-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, args: "" }
          - { name: macos-arm, os: macos-latest, args: "--target aarch64-apple-darwin" }
          - { name: macos-intel, os: macos-15-intel, args: "--target x86_64-apple-darwin" }
          - { name: linux, os: ubuntu-22.04, args: "" }
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.args, 'aarch64') && 'aarch64-apple-darwin' || contains(matrix.args, 'x86_64') && 'x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/miner/src-tauri

      - name: Linux webkit deps
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install
        run: pnpm install --frozen-lockfile --filter @etica-hub/miner

      # macOS: Developer ID signing + notarization. With no Apple secrets the build stays unsigned;
      # with a certificate, every notarization secret must be present too (no silently unnotarized releases).
      - name: Apple signing setup
        if: startsWith(matrix.name, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::APPLE_CERTIFICATE not set, building unsigned macOS app"
            exit 0
          fi
          for v in APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_B64; do
            if [ -z "${!v}" ]; then echo "::error::$v secret is missing; set all Apple secrets or none"; exit 1; fi
          done
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY; do
            echo "$v=${!v}" >> "$GITHUB_ENV"
          done
          echo "$APPLE_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/miner
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'miner-latest' }}
          releaseName: EticaHub Miner ${{ github.ref_type == 'tag' && github.ref_name || 'dev build' }}
          releaseBody: |
            One-click ETI (CPU) + EGAZ (GPU) miner for the EticaHub pools.
            Windows: .msi or -setup.exe. macOS: .dmg (Apple Silicon or Intel). Linux: .AppImage or .deb.
            macOS builds are signed and notarized by Apple. Windows is unsigned for now: SmartScreen will ask you to confirm the first run.
          releaseDraft: false
          prerelease: ${{ github.ref_type != 'tag' }}
          args: ${{ matrix.args }}
