name: Bridge heartbeat (live)

# Calls BridgeMinter.heartbeat() on each configured remote chain every
# 15 min. The on-chain heartbeatTimeout default is 4h, giving ~16
# successful runs of margin before the contract auto-pauses inbound
# deposits.
#
# Skip-clean semantics:
#   - If BRIDGE_HEARTBEAT_PRIVATE_KEY is unset, the script logs and exits 0.
#   - If a remote's minter address is unset, the script skips that remote
#     and continues. CI stays green pre-deploy.
#
# Permissions on-chain: the heartbeat-signer EOA is configured via
# `requestSetHeartbeatSigner` (24h timelock). Its only ability is to
# refresh a timestamp; rotating it is a routine ops procedure if the key
# ever leaks.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat:
    name: Heartbeat tick
    runs-on: ubuntu-latest
    environment: bridge-watcher
    env:
      BRIDGE_ETICA_RPC_URL: ${{ vars.BRIDGE_ETICA_RPC_URL || 'https://eticamainnet.eticaprotocol.org' }}
      BRIDGE_ETICA_CHAIN_ID: ${{ vars.BRIDGE_ETICA_CHAIN_ID || '61803' }}
      BRIDGE_MINTER_ETH_ADDRESS: ${{ vars.BRIDGE_MINTER_ETH_ADDRESS }}
      BRIDGE_ETH_RPC_URL: ${{ vars.BRIDGE_ETH_RPC_URL || 'https://ethereum-rpc.publicnode.com' }}
      BRIDGE_ETH_DOMAIN: ${{ vars.BRIDGE_ETH_DOMAIN || '1' }}
      BRIDGE_MINTER_BNB_ADDRESS: ${{ vars.BRIDGE_MINTER_BNB_ADDRESS }}
      BRIDGE_BNB_RPC_URL: ${{ vars.BRIDGE_BNB_RPC_URL || 'https://bsc-rpc.publicnode.com' }}
      BRIDGE_BNB_DOMAIN: ${{ vars.BRIDGE_BNB_DOMAIN || '56' }}
      BRIDGE_HEARTBEAT_PRIVATE_KEY: ${{ secrets.BRIDGE_HEARTBEAT_PRIVATE_KEY }}
      BRIDGE_TELEGRAM_BOT_TOKEN: ${{ secrets.BRIDGE_TELEGRAM_BOT_TOKEN }}
      BRIDGE_TELEGRAM_CHAT_ID: ${{ secrets.BRIDGE_TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Heartbeat tick
        run: pnpm --filter @etica-hub/bridge-watcher run heartbeat
