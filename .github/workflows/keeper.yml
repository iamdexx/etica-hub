name: Keeper (dry-run)

# Scheduled keeper that reads open orders from the on-chain OrderRegistry
# and logs "would attempt fill" lines. Never submits transactions — the
# entry point (`apps/keeper/src/dry-run.ts`) force-enables dryRun.
#
# Runs every 5 minutes. If the registry is not yet deployed (the default
# today — DEPLOYMENTS[61803].orderRegistry is zero), the workflow exits
# cleanly with a "skipped" message and does not fail.
#
# Manual runs: workflow_dispatch lets you trigger an ad-hoc dry-run from
# the Actions tab, useful for sanity-checking after you deploy the
# registry and wire its address into the repo variable / secret.

on:
  schedule:
    # Every 5 minutes. GitHub-hosted runners frequently drop/delay cron
    # events, so this is a best-effort lower bound, not a guarantee.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keeper-dry-run:
    name: Dry-run tick
    runs-on: ubuntu-latest
    # Use repo variables so the registry address can be set once the
    # `OrderRegistry` is deployed, without a code change. Secrets are only
    # needed if you later wire a signer key for a non-dry-run keeper — not
    # used here.
    env:
      KEEPER_RPC_URL: ${{ vars.KEEPER_RPC_URL || 'https://rpc.eticascan.org' }}
      KEEPER_CHAIN_ID: ${{ vars.KEEPER_CHAIN_ID || '61803' }}
      KEEPER_REACTOR_ADDRESS: ${{ vars.KEEPER_REACTOR_ADDRESS || '0x85e02C7F1bDFfBC3a018a91da84C3095F01d5d22' }}
      KEEPER_REGISTRY_ADDRESS: ${{ vars.KEEPER_REGISTRY_ADDRESS || '0x0000000000000000000000000000000000000000' }}
      KEEPER_POLL_BATCH_SIZE: '100'
      KEEPER_DEADLINE_GRACE_SECONDS: '30'
      # Never submit — this workflow is log-only.
      KEEPER_DRY_RUN: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Dry-run
        run: pnpm --filter @etica-hub/keeper run dry-run
