name: Keeper (dry-run)

# Scheduled keeper smoke check. Never submits transactions — the entry point
# (`apps/keeper/src/dry-run.ts`) force-enables dryRun.
#
# This scheduled workflow is intentionally a no-op until the Etica RPC endpoint
# and registry are known healthy. Use a separate live/manual workflow when a
# real keeper should read from chain.

on:
  schedule:
    # Every 5 minutes. GitHub-hosted runners frequently drop/delay cron
    # events, so this is a best-effort lower bound, not a guarantee.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keeper-dry-run:
    name: Dry-run tick
    runs-on: ubuntu-latest
    env:
      # Force this scheduled dry-run to stay off-chain. Repo variables may point
      # at an RPC endpoint with an expired certificate; this job should verify
      # the keeper command still starts and exits cleanly, not depend on that
      # external endpoint being healthy.
      KEEPER_RPC_URL: 'http://127.0.0.1:8545'
      KEEPER_CHAIN_ID: '61803'
      KEEPER_REACTOR_ADDRESS: '0xE2fc7EAcEB0146560bfcf46CC5B167df60E970B8'
      KEEPER_REGISTRY_ADDRESS: '0x0000000000000000000000000000000000000000'
      ORDERBOOK_URL: ''
      KEEPER_POLL_BATCH_SIZE: '100'
      KEEPER_DEADLINE_GRACE_SECONDS: '30'
      # Never submit — this workflow is log-only.
      KEEPER_DRY_RUN: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Dry-run
        run: pnpm --filter @etica-hub/keeper run dry-run
