name: Bridge deploy (Hyperlane USDC.e)

# One-shot mainnet deploy of Hyperlane core on Etica + the USDC (Ethereum) ->
# USDC.e (Etica) warp route, signed by the farm/harvest keeper key that already
# lives in the `harvest-live` environment. The key never leaves GitHub: this
# job derives the address from it, checks the wallet is funded, runs
# infra/hyperlane/deploy.sh, and publishes the rendered registry (addresses
# only, no secrets) as an artifact and on a `bridge-deploy/<run>` branch.
#
# Roles (deploy.sh refuses to run if they are not distinct):
#   OWNER      Safe / cold wallet that owns mailbox, ISM, routers, rate limit
#   VALIDATOR  address of the validator key generated on the agent host
#   GUARDIAN   pause-only key held by the health-check host
#   KEEPER     this workflow's signer (relayer, fee-contract owner, deployer)
#
# Needs in `harvest-live`: secret HARVEST_KEEPER_PRIVATE_KEY (exists).
# Optional: secret BRIDGE_ETHEREUM_RPC_URL (comma-separated Ethereum RPCs;
# blank = public rotation below). Fund the keeper with >= 0.05 ETH on
# Ethereum (the ~5 contracts cost ~0.02 ETH at 2 gwei; check gas on the day)
# and ~5 EGAZ on Etica before dispatching.

on:
  workflow_dispatch:
    inputs:
      step:
        description: 'What to deploy'
        type: choice
        options: [core, warp, agent-config, all]
        default: all
      owner:
        description: 'OWNER address (Safe or cold wallet; not the keeper)'
        required: true
      validator:
        description: 'VALIDATOR address (from the agent host)'
        required: true
      guardian:
        description: 'GUARDIAN address (pause-only)'
        required: true
      confirm:
        description: 'Type DEPLOY-MAINNET to run; anything else only pre-flights'
        default: ''

permissions:
  contents: write

concurrency:
  group: bridge-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy with the harvest keeper
    runs-on: ubuntu-latest
    environment: harvest-live
    timeout-minutes: 60
    env:
      OWNER: ${{ inputs.owner }}
      VALIDATOR: ${{ inputs.validator }}
      GUARDIAN: ${{ inputs.guardian }}
      ETICA_RPC: ${{ vars.HARVEST_RPC_URL || 'https://rpc2.etica-stats.org' }}
      # Keyless public endpoints that serve eth_call + bounded eth_getLogs; the
      # CLI fails over down the list. Same set as the bridge-gas keeper.
      ETHEREUM_RPCS: ${{ secrets.BRIDGE_ETHEREUM_RPC_URL || 'https://gateway.tenderly.co/public/mainnet,https://rpc.mevblocker.io,https://eth.drpc.org,https://ethereum-rpc.publicnode.com' }}
      REGISTRY: ${{ github.workspace }}/infra/hyperlane/registry
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1

      - name: Pre-flight (addresses, roles, balances)
        env:
          HYP_KEY: ${{ secrets.HARVEST_KEEPER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$HYP_KEY" ]] || { echo "HARVEST_KEEPER_PRIVATE_KEY missing in harvest-live"; exit 1; }
          ETHEREUM_RPC="${ETHEREUM_RPCS%%,*}"
          echo "::add-mask::$ETHEREUM_RPC"
          echo "ETHEREUM_RPC=$ETHEREUM_RPC" >> "$GITHUB_ENV"
          KEEPER="$(cast wallet address --private-key "$HYP_KEY")"
          echo "::add-mask::$HYP_KEY"
          echo "KEEPER=$KEEPER" >> "$GITHUB_ENV"
          echo "keeper   $KEEPER"
          echo "owner    $OWNER"
          echo "validator $VALIDATOR"
          echo "guardian $GUARDIAN"
          for a in "$OWNER" "$VALIDATOR" "$GUARDIAN"; do
            [[ "$a" =~ ^0x[0-9a-fA-F]{40}$ ]] || { echo "not an address: $a"; exit 1; }
            [[ "${a,,}" != "${KEEPER,,}" ]] || { echo "$a is the keeper; OWNER/VALIDATOR/GUARDIAN must be other keys"; exit 1; }
          done
          [[ "${OWNER,,}" != "${VALIDATOR,,}" ]] || { echo "OWNER and VALIDATOR must differ"; exit 1; }
          eth_wei="$(cast balance "$KEEPER" --rpc-url "$ETHEREUM_RPC")"
          egaz_wei="$(cast balance "$KEEPER" --rpc-url "$ETICA_RPC")"
          echo "keeper ETH  $(cast from-wei "$eth_wei")"
          echo "keeper EGAZ $(cast from-wei "$egaz_wei")"
          need_eth=50000000000000000    # 0.05 ETH
          need_egaz=5000000000000000000 # 5 EGAZ
          if [[ "${{ inputs.step }}" == "warp" || "${{ inputs.step }}" == "all" ]]; then
            python3 -c "import sys; sys.exit(0 if int('$eth_wei') >= $need_eth else 1)" || { echo "keeper needs >= 0.05 ETH on Ethereum for the warp deploy"; exit 1; }
            gas_wei="$(cast gas-price --rpc-url "$ETHEREUM_RPC")"
            echo "ethereum gas price: $(cast from-wei "$gas_wei" gwei) gwei"
            # ~8M gas for the Ethereum side of the warp deploy; refuse if the wallet can't cover 2x that.
            python3 -c "import sys; sys.exit(0 if int('$eth_wei') >= 2 * 8_000_000 * int('$gas_wei') else 1)" || { echo "keeper ETH would not cover ~16M gas at the current gas price; top up or wait for cheaper gas"; exit 1; }
          fi
          python3 -c "import sys; sys.exit(0 if int('$egaz_wei') >= $need_egaz else 1)" || { echo "keeper needs >= 5 EGAZ on Etica"; exit 1; }
          echo "ethereum chain id: $(cast chain-id --rpc-url "$ETHEREUM_RPC")"
          [[ "$(cast chain-id --rpc-url "$ETHEREUM_RPC")" == "1" ]] || { echo "BRIDGE_ETHEREUM_RPC_URL is not Ethereum mainnet"; exit 1; }
          [[ "$(cast chain-id --rpc-url "$ETICA_RPC")" == "61803" ]] || { echo "ETICA_RPC is not Etica mainnet"; exit 1; }

      - name: Point the CLI's Ethereum reads at our RPC list
        run: |
          set -euo pipefail
          # The CLI takes Ethereum metadata from the public Hyperlane registry; a
          # local copy with our RPC list takes precedence. Addresses stay canonical.
          mkdir -p "$REGISTRY/chains/ethereum"
          base=https://raw.githubusercontent.com/hyperlane-xyz/hyperlane-registry/main/chains/ethereum
          curl -fsSL "$base/metadata.yaml" -o "$REGISTRY/chains/ethereum/metadata.yaml"
          curl -fsSL "$base/addresses.yaml" -o "$REGISTRY/chains/ethereum/addresses.yaml"
          pip install --quiet pyyaml
          python3 - <<'PY'
          import os, yaml
          p = os.path.join(os.environ['REGISTRY'], 'chains/ethereum/metadata.yaml')
          d = yaml.safe_load(open(p))
          d['rpcUrls'] = [{'http': u.strip()} for u in os.environ['ETHEREUM_RPCS'].split(',') if u.strip()]
          yaml.safe_dump(d, open(p, 'w'))
          PY
          grep -q 'mailbox: "0xc005dc82818d67AF737725bD4bf75435d065D239"' "$REGISTRY/chains/ethereum/addresses.yaml" \
            || { echo "unexpected Ethereum mailbox in registry"; exit 1; }

      - name: Deploy
        if: ${{ inputs.confirm == 'DEPLOY-MAINNET' }}
        env:
          HYP_KEY: ${{ secrets.HARVEST_KEEPER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # A configured RPC URL may carry an API key; keep it out of the log.
          for u in ${ETHEREUM_RPCS//,/ }; do echo "::add-mask::$u"; done
          chmod +x infra/hyperlane/deploy.sh
          infra/hyperlane/deploy.sh "${{ inputs.step }}" 2>&1 | sed -E 's#(private-key|HYP_KEY)[= ]+0x[0-9a-fA-F]+#\1 <redacted>#g'

      - name: Dry run only
        if: ${{ inputs.confirm != 'DEPLOY-MAINNET' }}
        run: echo "Pre-flight passed. Re-dispatch with confirm=DEPLOY-MAINNET to deploy."

      - name: Publish rendered registry (addresses only)
        if: ${{ inputs.confirm == 'DEPLOY-MAINNET' }}
        run: |
          set -euo pipefail
          # Never publish the RPC override (it may hold an API key).
          rm -f "$REGISTRY/chains/ethereum/metadata.yaml"
          git config user.name "etica-hub-bot"
          git config user.email "bot@eticahub.com"
          branch="bridge-deploy/${{ github.run_id }}"
          git checkout -b "$branch"
          git add infra/hyperlane/registry
          git diff --cached --quiet && { echo "nothing rendered"; exit 0; }
          ! git diff --cached | grep -qiE 'private|0x[0-9a-f]{64}' || { echo "refusing to publish: looks like a key in the diff"; exit 1; }
          git commit -m "bridge: mainnet deploy ${{ inputs.step }} (run ${{ github.run_id }})"
          git push origin "$branch"
          echo "Rendered registry pushed to $branch — open a PR to wire the addresses into shared/addresses and the bridge-gas vars."

      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.confirm == 'DEPLOY-MAINNET' }}
        with:
          name: hyperlane-registry-${{ github.run_id }}
          path: |
            infra/hyperlane/registry/deployments
            infra/hyperlane/registry/chains/etica
          if-no-files-found: ignore
