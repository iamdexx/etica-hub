name: Labs Autopilot

# EticaLabs Autopilot worker tick.
#
# Pops the oldest pending Labs research job from Redis (via the website's
# /api/labs/queue/pop endpoint), runs a Nvidia Nemotron plan -> NVIDIA
# ESMFold fold -> Nemotron analyse -> mutate loop for up to maxIterations
# rounds, and posts results back via /api/labs/queue/[id]/update.
#
# Runs every 10 minutes by default — GitHub free-tier shared runners
# delay schedule events under load, so this is best-effort. The worker
# itself is idempotent: an empty queue tick is a no-op (204 from /pop).
#
# Required repository secrets:
#   LABS_AUTOPILOT_TOKEN   — shared secret with the website (same value
#                            as the LABS_AUTOPILOT_TOKEN env var on Vercel)
#   NVIDIA_API_KEY         — NVIDIA NIM; used for Nemotron LLM + ESMFold
#
# Optional repository secrets (multi-key rotation):
#   NVIDIA_API_KEYS        — comma-separated NVIDIA keys for round-robin
#
# Optional repo variables:
#   LABS_AUTOPILOT_BASE_URL          — defaults to https://eticahub.com
#   LABS_AUTOPILOT_MAX_JOBS_PER_TICK — defaults to 5 (drains a small
#                                      backlog in a single tick so a
#                                      throttled scheduler doesn't leave
#                                      branches sitting in QUEUED for hours)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      max_jobs:
        description: 'Override LABS_AUTOPILOT_MAX_JOBS_PER_TICK for this run'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: labs-autopilot
  cancel-in-progress: false

jobs:
  tick:
    name: Worker tick
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LABS_AUTOPILOT_BASE_URL: ${{ vars.LABS_AUTOPILOT_BASE_URL || 'https://eticahub.com' }}
      LABS_AUTOPILOT_MAX_JOBS_PER_TICK: ${{ github.event.inputs.max_jobs || vars.LABS_AUTOPILOT_MAX_JOBS_PER_TICK || '5' }}
      LABS_AUTOPILOT_TOKEN: ${{ secrets.LABS_AUTOPILOT_TOKEN }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_API_KEYS: ${{ secrets.NVIDIA_API_KEYS }}
    steps:
      - name: Guard — required secrets present
        id: guard
        run: |
          missing=0
          if [ -z "$LABS_AUTOPILOT_TOKEN" ]; then echo "::warning::LABS_AUTOPILOT_TOKEN secret not set"; missing=1; fi
          if [ -z "$NVIDIA_API_KEY" ] && [ -z "$NVIDIA_API_KEYS" ]; then echo "::warning::NVIDIA_API_KEY (or NVIDIA_API_KEYS) secret not set"; missing=1; fi
          if [ "$missing" = "1" ]; then
            echo "::warning::Labs Autopilot secrets not configured; skipping tick."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4

      - if: steps.guard.outputs.skip != 'true'
        uses: pnpm/action-setup@v4

      - if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install
        if: steps.guard.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Tick
        if: steps.guard.outputs.skip != 'true'
        run: pnpm --filter @etica-hub/labs-autopilot run worker:tick
