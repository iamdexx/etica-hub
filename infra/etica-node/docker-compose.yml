services:
  node:
    build:
      context: ./core-geth   # git clone https://github.com/etica/core-geth
      dockerfile: ../Dockerfile
    image: etica-core-geth
    container_name: etica-archive
    restart: unless-stopped
    command: >
      --etica --config /config.toml --syncmode full --gcmode archive --cache 768
      --datadir /data --port 30304 --nat extip:165.22.225.91
      --http --http.addr 0.0.0.0 --http.port 8545 --http.vhosts=* --http.corsdomain=*
      --http.api eth,net,web3 --graphql --graphql.vhosts=* --graphql.corsdomain=*
      --ws --ws.addr 0.0.0.0 --ws.port 8546 --ws.origins=* --ws.api eth,net,web3
      --rpc.allow-unprotected-txs --maxpeers 40
      --mine --miner.threads=0 --miner.etherbase 0x679FeeB936ec769c05842bE51b45e3B5b34F43a9 --miner.extradata eticahub
      --bootnodes enode://b0e97d2f1a37b2035a34b97f32fb31ddd93ae822b603c56b7f17cfb189631ea2ef17bfbed904f8bc564765634f2d9db0a128835178c8af9f1dde68ee6b5e2bf7@167.172.47.195:30303
    ports: ["127.0.0.1:8547:8545", "127.0.0.1:8548:8546", "30304:30304", "30304:30304/udp"]
    volumes: ["./data:/data", "./config.toml:/config.toml:ro"]
    mem_limit: 2200m
    networks: [default, droplet_default]
    logging: { driver: json-file, options: { max-size: "20m", max-file: "3" } }

networks:
  droplet_default:
    external: true
