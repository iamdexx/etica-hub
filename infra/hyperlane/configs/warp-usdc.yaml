# USDC warp route: Ethereum (collateral, real USDC) -> Etica (synthetic USDC.e).
#
#   hyperlane warp deploy --warp-route-id USDC/etica --registry ./infra/hyperlane/registry
#
# Placeholders are filled by `infra/hyperlane/deploy.sh` from env:
#   0x000…0  OWNER     bridge owner (routers, rate-limit ISM). A Safe/timelock, never a hot key.
#   validators: entries  VALIDATOR   the EticaHub validator EOA
#   0x111…1  KEEPER    relayer / gas-paying EOA; owns the fee contracts (fees only, never collateral)
#   0x222…2  GUARDIAN  owner of the PausableIsm on each router. Pausing is the
#                      only power it has (deny-all), so a hot key is acceptable and
#                      the health check can halt the route on an invariant breach.
#
# Security model (see docs/BRIDGE_SECURITY_AUDIT.md):
#   * Every inbound message must pass ALL modules of the aggregation ISM:
#       - messageIdMultisigIsm   1-of-1 validator at launch (raise via `warp apply`)
#       - rateLimitedIsm         (Ethereum only) caps USDC released per 24h window so a
#                                validator/relayer compromise or an Etica reorg can only
#                                drain one window's capacity before the guardian pauses
#       - pausableIsm            guardian kill-switch
#   * Collateral release on Ethereum is the only place real value leaves; mints on
#     Etica are bounded by the Ethereum rate limit on the way back out.
#
# Fees (docs/BRIDGE_SECURITY_AUDIT.md F-1): both legs charge 50 bps capped at
# 50 USDC. Ethereum uses Hyperlane's LinearFee (deployed by the CLI):
#   fee = amount * maxFee / (2 * halfAmount), capped at maxFee
#   maxFee = 50 USDC, halfAmount = 5,000 USDC  ->  $100 pays $0.50, $1k $5, >= $10k $50
# Etica has NO tokenFee here on purpose: deploy.sh deploys
# packages/contracts/src/bridge/WarpFlatLinearFee.sol (flat 2 USDC.e + the same
# 50 bps/50 cap) and sets it as feeRecipient. The flat part covers the Ethereum
# delivery gas the relayer fronts on every redemption, so dust redemptions
# cannot drain the relayer's ETH.

ethereum:
  type: collateral
  token: '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
  owner: '0x0000000000000000000000000000000000000000'
  interchainSecurityModule:
    type: staticAggregationIsm
    threshold: 3
    modules:
      - type: messageIdMultisigIsm
        threshold: 1
        validators:
          - '0x0000000000000000000000000000000000000000'
      # 51,840 USDC per rolling 24h (refill 0.6 USDC/s). Owner raises it with
      # setRefillRate once volume and validator set justify it.
      - type: rateLimitedIsm
        maxCapacity: '51840000000'
        duration: 86400
        owner: '0x0000000000000000000000000000000000000000'
      - type: pausableIsm
        paused: false
        owner: '0x2222222222222222222222222222222222222222'
  tokenFee:
    type: LinearFee
    owner: '0x1111111111111111111111111111111111111111'
    beneficiary: '0x1111111111111111111111111111111111111111'
    maxFee: '50000000'
    halfAmount: '5000000000'

etica:
  type: synthetic
  name: 'USD Coin (Etica)'
  symbol: 'USDC.e'
  decimals: 6
  owner: '0x0000000000000000000000000000000000000000'
  interchainSecurityModule:
    type: staticAggregationIsm
    threshold: 2
    modules:
      - type: messageIdMultisigIsm
        threshold: 1
        validators:
          - '0x0000000000000000000000000000000000000000'
      - type: pausableIsm
        paused: false
        owner: '0x2222222222222222222222222222222222222222'
